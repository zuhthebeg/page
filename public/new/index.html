<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>내 페이지 만들기 · page.cocy.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
<style>
:root{--bg:#0b0b0d;--bg-2:#15151b;--bg-3:#1d1d25;--ink:#ece9e4;--ink-soft:#aaa6a0;--muted:#6f6b66;--accent:#c9a86a;--accent-2:#e9cd92;--line:rgba(236,233,228,.12)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",sans-serif;font-weight:300;line-height:1.7}
.wrap{max-width:680px;margin:0 auto;padding:48px 22px 90px}
.eyebrow{font-family:"Jost",sans-serif;text-transform:uppercase;letter-spacing:.4em;font-size:.66rem;color:var(--accent)}
h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:2.4rem;margin:.4rem 0 .3rem}
.sub{color:var(--ink-soft);margin-bottom:2.4rem}
.step{margin-bottom:2rem}
.step > label{display:block;font-weight:500;margin-bottom:.7rem;font-size:.95rem}
.step .hint{color:var(--muted);font-size:.8rem;font-weight:300;margin-left:.4rem}
.chips{display:flex;flex-wrap:wrap;gap:.55rem}
.chip{padding:.6rem 1rem;border:1px solid var(--line);border-radius:40px;background:var(--bg-2);color:var(--ink-soft);
  cursor:pointer;font-size:.88rem;transition:.2s;user-select:none}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:#1a160e;border-color:var(--accent);font-weight:500}
input[type=text],textarea{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:8px;color:var(--ink);
  padding:.85rem 1rem;font-family:inherit;font-size:.95rem;font-weight:300}
textarea{min-height:140px;resize:vertical;line-height:1.6}
input::placeholder,textarea::placeholder{color:var(--muted)}
.go{margin-top:1rem;width:100%;padding:1.05rem;border:none;border-radius:8px;background:var(--accent);color:#1a160e;
  font-family:"Jost",sans-serif;font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:.9rem;cursor:pointer;transition:.3s}
.go:hover{background:var(--accent-2)}
.go:disabled{opacity:.5;cursor:not-allowed}
#status{margin-top:1.4rem;text-align:center;color:var(--ink-soft);min-height:1.4rem}
#status a{color:var(--accent-2)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
.result{margin-top:1.6rem;padding:1.3rem;background:var(--bg-2);border:1px solid var(--accent);border-radius:10px;display:none}
.result.on{display:block}
.result h3{font-family:"Cormorant Garamond",serif;font-size:1.4rem;font-weight:600;margin-bottom:.5rem}
.result a.btn{display:inline-block;margin-top:.7rem;padding:.6rem 1.2rem;border:1px solid var(--accent);border-radius:6px;color:var(--accent-2);text-decoration:none;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">page.cocy.io</div>
  <h1>당신만의 페이지를 만들어요</h1>
  <p class="sub">몇 가지만 고르면, 당신의 분위기에 맞춰 새로 그려드립니다.</p>

  <div class="step">
    <label>1. 어떤 페이지인가요?</label>
    <div class="chips" id="vertical">
      <div class="chip" data-v="portfolio">포트폴리오</div>
      <div class="chip" data-v="wedding">청첩장</div>
      <div class="chip" data-v="menu">메뉴판</div>
      <div class="chip" data-v="profile">프로필/명함</div>
    </div>
  </div>

  <div class="step">
    <label>2. 어떤 느낌이면 좋겠어요? <span class="hint">복수 선택</span></label>
    <div class="chips" id="mood">
      <div class="chip" data-m="고급스러운">고급스러운</div>
      <div class="chip" data-m="화사한">화사한</div>
      <div class="chip" data-m="미니멀한">미니멀한</div>
      <div class="chip" data-m="따뜻한">따뜻한</div>
      <div class="chip" data-m="다크하고 시크한">다크 시크</div>
      <div class="chip" data-m="컬러풀한">컬러풀</div>
      <div class="chip" data-m="특별한 모션/효과">특별한 효과</div>
    </div>
  </div>

  <div class="step">
    <label>3. 색감</label>
    <div class="chips" id="palette">
      <div class="chip" data-p="모노톤(흑백)">모노톤</div>
      <div class="chip" data-p="브라운·브라스 딥톤">브라운·브라스</div>
      <div class="chip" data-p="네이비·블루">네이비</div>
      <div class="chip" data-p="파스텔">파스텔</div>
      <div class="chip" data-p="비비드 컬러">비비드</div>
    </div>
  </div>

  <div class="step">
    <label>4. 제목 / 이름</label>
    <input type="text" id="title" placeholder="예: 김하늘 · 사진가  /  카페 모모 메뉴  /  지우 ♥ 서연 결혼합니다" />
  </div>

  <div class="step">
    <label>5. 내용을 들려주세요 <span class="hint">자유롭게 — 소개, 메뉴, 식순, 연락처 등</span></label>
    <textarea id="content" placeholder="예) 15년차 다이닝 셰프. 시그니처는 랍스터 비스크. 서울 한남동에서 프라이빗 다이닝 운영. 예약 010-..."></textarea>
  </div>

  <button class="go" id="go">✦ 페이지 생성하기</button>
  <div id="status"></div>
  <div class="result" id="result">
    <h3 id="rtitle"></h3>
    <div id="rurl" style="color:var(--ink-soft);font-size:.9rem"></div>
    <a class="btn" id="rlink" target="_blank">페이지 열기 →</a>
  </div>
</div>

<script>
const pick = (id, multi) => {
  const box = document.getElementById(id);
  box.addEventListener('click', e => {
    const c = e.target.closest('.chip'); if (!c) return;
    if (multi) c.classList.toggle('on');
    else { box.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); c.classList.add('on'); }
  });
};
pick('vertical', false); pick('mood', true); pick('palette', false);
const vals = (id, attr) => [...document.querySelectorAll(`#${id} .chip.on`)].map(c => c.dataset[attr]);

document.getElementById('go').addEventListener('click', async () => {
  const vertical = vals('vertical','v')[0];
  const content = document.getElementById('content').value.trim();
  const status = document.getElementById('status');
  if (!vertical) { status.textContent = '① 페이지 종류를 골라주세요.'; return; }
  if (content.length < 4) { status.textContent = '⑤ 내용을 적어주세요.'; return; }

  const body = {
    vertical,
    mood: vals('mood','m'),
    palette: vals('palette','p')[0] || '',
    title: document.getElementById('title').value.trim(),
    content, lang: 'ko'
  };
  const btn = document.getElementById('go');
  btn.disabled = true;
  status.innerHTML = '<span class="spin"></span>당신만의 페이지를 그리는 중… (20~40초)';
  document.getElementById('result').classList.remove('on');
  try {
    const tok = localStorage.getItem('cocy_auth_token');
    const r = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(tok ? { Authorization: 'Bearer ' + tok } : {}) },
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    status.textContent = '완성됐어요!';
    document.getElementById('rtitle').textContent = d.title;
    document.getElementById('rurl').textContent = d.url;
    const link = document.getElementById('rlink'); link.href = '/' + d.slug;
    document.getElementById('result').classList.add('on');
  } catch (e) {
    status.textContent = '생성에 실패했어요: ' + e.message;
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
