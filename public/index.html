<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="naver-site-verification" content="7e48f3f9d2edcbdc5bd8ea926d97267d4decdbac" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>page.cocy.io — 최근 페이지</title>
<meta name="description" content="cocy가 만든 보고서·팩트체크·도구 페이지 모음. 최신순." />
<meta property="og:title" content="page.cocy.io — 최근 페이지" />
<meta property="og:description" content="cocy가 만든 보고서·팩트체크·도구 페이지 모음. 최신순." />
<meta property="og:type" content="website" />
<meta name="theme-color" content="#faf9f6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{
  --bg:#faf9f6; --ink:#17171a; --soft:#5d5c63; --muted:#94939a; --line:#e7e5df; --hover:#f1efe9;
  --accent:#d1452b; --chip:#efede7;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121214;--ink:#ececee;--soft:#a9a8af;--muted:#6f6e75;--line:#26262a;--hover:#1b1b1e;--accent:#ff7a5c;--chip:#1e1e22}
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}

header{padding:28px 0 8px;padding-top:max(28px,env(safe-area-inset-top))}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.logo{font-size:1.05rem;font-weight:800;letter-spacing:-.02em}
.logo b{color:var(--accent)}
.links{display:flex;gap:14px;font-size:.84rem;color:var(--soft)}
.links a:hover{color:var(--ink)}
.lock{font-size:.72rem;font-weight:600;color:var(--soft);background:var(--chip);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:.1em}
#gbtn{display:inline-block;vertical-align:middle}
.count{margin-top:6px;font-size:.82rem;color:var(--muted)}

.searchbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid var(--line)}
.searchbar input{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--chip);border:0;border-radius:10px;padding:11px 14px;outline:none;-webkit-appearance:none}
.searchbar input::placeholder{color:var(--muted)}
.searchbar input:focus{box-shadow:0 0 0 2px var(--accent) inset}

.month{font-size:.78rem;font-weight:700;color:var(--muted);letter-spacing:.04em;padding:26px 0 6px}
ul{list-style:none}
li a{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:14px 8px;margin:0 -8px;border-radius:10px;border-bottom:1px solid var(--line)}
li:last-child a{border-bottom:0}
li a:hover,li a:active{background:var(--hover)}
.d{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:3px}
.t{font-size:1.06rem;font-weight:650;letter-spacing:-.015em;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.new{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px;vertical-align:.15em}
.s{margin-top:3px;font-size:.86rem;color:var(--soft);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
footer{padding:36px 0 48px;padding-bottom:max(48px,env(safe-area-inset-bottom));font-size:.8rem;color:var(--muted);text-align:center}
footer a{text-decoration:underline;text-underline-offset:3px}
@media (min-width:640px){ .t{font-size:1.12rem} li a{grid-template-columns:52px 1fr} }
</style>
</head>
<body>
<header class="wrap">
  <div class="top">
    <a class="logo" href="/">page<b>.</b>cocy.io</a>
    <nav class="links"><a href="/showcase/">쇼케이스</a><a href="/new">만들기</a><a href="#" id="login">로그인</a><a href="#" id="logout" hidden>로그아웃</a></nav>
  </div>
  <div class="count" id="count">&nbsp;</div>
  <div id="gbtn"></div>
</header>

<div class="searchbar"><div class="wrap"><input id="q" type="search" placeholder="제목·설명 검색" autocomplete="off" /></div></div>

<main class="wrap" id="list"><div class="empty">불러오는 중…</div></main>

<footer class="wrap">서비스 소개·내 페이지 관리는 <a href="/showcase/">쇼케이스</a>에서</footer>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toDate=v=>{ if(v==null||v==='') return null; const d=typeof v==='number'?new Date(v):new Date(/^\d+$/.test(v)?+v:String(v).replace(' ','T')+(/[zZ]|[+-]\d\d:?\d\d$/.test(v)?'':'Z')); return isNaN(d)?null:d; };
const pad=n=>String(n).padStart(2,'0');
let ITEMS=[];
const GCID='315180918727-3d9rfmpa36r365qna9smdsvrod441jhd.apps.googleusercontent.com';
const jwt=t=>{ try{ return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))); }catch{ return null; } };
let TOKEN=localStorage.getItem('page_id_token'); const P=TOKEN&&jwt(TOKEN);
if(!(P&&P.exp*1000>Date.now())){ TOKEN=null; localStorage.removeItem('page_id_token'); }
if(TOKEN){ $('login').hidden=true; $('logout').hidden=false; }
$('logout').onclick=e=>{ e.preventDefault(); localStorage.removeItem('page_id_token'); location.reload(); };
$('login').onclick=e=>{ e.preventDefault(); (function go(){ if(!(window.google&&google.accounts&&google.accounts.id)) return setTimeout(go,200);
  google.accounts.id.initialize({client_id:GCID,callback:r=>{ localStorage.setItem('page_id_token',r.credential); location.reload(); }});
  google.accounts.id.renderButton($('gbtn'),{theme:'outline',size:'medium',text:'signin',shape:'pill'}); google.accounts.id.prompt(); })(); };

async function load(){
  const [feed,sites,priv]=await Promise.all([
    fetch('/feed.json',{cache:'no-cache'}).then(r=>r.ok?r.json():{items:[]}).catch(()=>({items:[]})),
    fetch('/api/sites').then(r=>r.ok?r.json():{sites:[]}).catch(()=>({sites:[]})),
    TOKEN?fetch('/api/private-feed',{headers:{authorization:'Bearer '+TOKEN}}).then(r=>r.ok?r.json():{items:[]}).catch(()=>({items:[]})):{items:[]},
  ]);
  const by=new Map();
  for(const x of feed.items||[]) by.set(x.slug,{slug:x.slug,title:x.title,desc:x.desc,date:toDate(x.date)});
  // feed.json에 없는 D1 등록 페이지(KV 서빙 등) 보충
  for(const s of sites.sites||[]) if(!by.has(s.slug)) by.set(s.slug,{slug:s.slug,title:s.title||s.slug,desc:s.description||'',date:toDate(s.published_at)});
  // 로그인 시 비공개 페이지 (🔒)
  for(const x of priv.items||[]) if(!by.has(x.slug)) by.set(x.slug,{slug:x.slug,title:x.title||x.slug,desc:x.desc||'',date:toDate(x.date),priv:true});
  ITEMS=[...by.values()].sort((a,b)=>(b.date||0)-(a.date||0));
  const np=ITEMS.filter(x=>x.priv).length;
  $('count').textContent=`페이지 ${ITEMS.length}개${np?` (비공개 ${np})`:''} · 최신순`;
  render();
}

function render(){
  const q=$('q').value.trim().toLowerCase();
  const rows=q?ITEMS.filter(x=>(x.title+' '+x.desc+' '+x.slug).toLowerCase().includes(q)):ITEMS;
  if(!rows.length){ $('list').innerHTML=`<div class="empty">${q?'검색 결과가 없어요':'페이지가 없어요'}</div>`; return; }
  const now=Date.now(); let html='', cur='';
  for(const x of rows){
    const d=x.date, key=d?`${d.getFullYear()}년 ${d.getMonth()+1}월`:'날짜 미상';
    if(key!==cur){ if(cur) html+='</ul>'; html+=`<h2 class="month">${key}</h2><ul>`; cur=key; }
    const fresh=d&&now-d<3*864e5;
    html+=`<li><a href="/${encodeURIComponent(x.slug)}"><span class="d">${d?pad(d.getMonth()+1)+'.'+pad(d.getDate()):''}</span><span><span class="t">${fresh?'<i class="new" title="최근 3일"></i>':''}${x.priv?'<span class="lock">🔒 비공개</span>':''}${esc(x.title)}</span>${x.desc?`<span class="s">${esc(x.desc)}</span>`:''}</span></a></li>`;
  }
  $('list').innerHTML=html+'</ul>';
}
$('q').addEventListener('input',render);
load();
</script>
</body>
</html>
