  const u=new URL(location.href);u.searchParams.set('lang',b.dataset.l);location.href=u;});

const STORY=['Captain America: The First Avenger','Captain Marvel','Iron Man','Iron Man 2','The Incredible Hulk','Thor','The Avengers','Iron Man 3','Thor: The Dark World','Captain America: The Winter Soldier','Guardians of the Galaxy','Guardians of the Galaxy Vol. 2','Avengers: Age of Ultron','Ant-Man','Captain America: Civil War','Black Widow','Black Panther','Spider-Man: Homecoming','Doctor Strange','Thor: Ragnarok','Ant-Man and the Wasp','Avengers: Infinity War','Avengers: Endgame','Loki','What If...?','WandaVision','Spider-Man: Far From Home','The Falcon and the Winter Soldier','Shang-Chi and the Legend of the Ten Rings','Eternals','Spider-Man: No Way Home','Hawkeye','Doctor Strange in the Multiverse of Madness','Ms. Marvel','Thor: Love and Thunder','Black Panther: Wakanda Forever','Ant-Man and the Wasp: Quantumania','Guardians of the Galaxy Vol. 3','Secret Invasion','The Marvels','Agatha All Along','Deadpool & Wolverine','Captain America: Brave New World','Daredevil: Born Again','Thunderbolts*','Ironheart','The Fantastic Four: First Steps','Spider-Man: Brand New Day'];
const STORY_IDX=Object.fromEntries(STORY.map((t,i)=>[t,i]));

/* ── 좌표 배치: 페이즈 기둥(개봉순) ↔ 시간순 컬럼, 토글로 재배치 ── */
const LANE_X={1:170,2:420,3:670,4:920,5:1170,6:1420};
const TOP=190, GAP=112;
const nodes=[...FILMS.map(f=>({...f})),{...DOOM,doom:1},{...SW}];
nodes.forEach(n=>{n.o=STORY_IDX[n.en]??999;});
const doomN=nodes[nodes.length-2], swN=nodes[nodes.length-1];
const films=nodes.filter(n=>!n.doom&&!n.sw);
const W=1620;let curH=0;

const map=document.getElementById('map'),stage=document.getElementById('stage');
const svg=document.getElementById('edges');

/* 노드 엘리먼트 생성 (위치는 layout에서) */
nodes.forEach(n=>{
  const el=document.createElement('div');
  el.className='node'+(n.sr?' series':'')+(n.doom?' doom':'')+(n.soon?' soon':'')+(n.sw?' sw':'');
  el.style.setProperty('--pc',PH_COLOR[n.ph]);
  el.innerHTML=`<div class="yr">${n.y}</div><div class="tt">${titleOf(n)}</div><div class="en">${subOf(n)}</div>`+
    (n.doom?`<div class="dday" id="node-dday"></div>`:'')+
    (n.soon?`<div class="dday" id="node-dday-bnd"></div>`:'');
  el._node=n;n.el=el;
  map.appendChild(el);
});

/* 레인 헤더 + 사가 태그 (개봉순 모드 전용) */
const YEARS={1:'2008–2012',2:'2013–2015',3:'2016–2019',4:'2021–2022',5:'2023–2025',6:'2025–2026'};
let hh='';
for(const ph of [1,2,3,4,5,6]){
  hh+=`<div class="lane-h rel-only" style="--pc:${PH_COLOR[ph]};left:${LANE_X[ph]}px;top:${TOP-72}px">${L.phase(ph)}<small>${YEARS[ph]}</small></div>`;
}
hh+=`<div class="saga-tag rel-only" style="left:420px;top:${TOP-138}px;color:#e62429">INFINITY SAGA</div>`;
hh+=`<div class="saga-tag rel-only" style="left:1170px;top:${TOP-138}px;color:#8a63ff">MULTIVERSE SAGA</div>`;
map.insertAdjacentHTML('beforeend',hh);

let MODE='rel';
function layout(){
  let orderList;
  if(MODE==='rel'){
    orderList=[...films].sort((a,b)=>a.rel-b.rel);
    const cnt={};
    orderList.forEach(n=>{
      const k=cnt[n.ph]=(cnt[n.ph]||0)+1;
      n.px=LANE_X[n.ph]+(k%2?-30:30);n.py=TOP+(k-1)*GAP;
    });
  }else{
    orderList=[...films].sort((a,b)=>a.o-b.o);
    const rows=Math.ceil(orderList.length/6);
    orderList.forEach((n,i)=>{
      const col=Math.floor(i/rows),row=i%rows;
      n.px=LANE_X[col+1]+(row%2?-30:30);n.py=TOP+row*GAP;
    });
  }
  const maxY=Math.max(...films.map(n=>n.py));
  doomN.px=810;doomN.py=maxY+220;
  swN.px=810;swN.py=doomN.py+150;
  curH=swN.py+200;
  map.style.width=W+'px';map.style.height=curH+'px';
  document.querySelectorAll('.rel-only').forEach(e=>e.style.display=MODE==='rel'?'':'none');
  nodes.forEach(n=>{
    n.el.style.left=n.px+'px';n.el.style.top=n.py+'px';
    const yr=n.el.querySelector('.yr');
    yr.textContent=(MODE==='story'&&!n.doom&&!n.sw)?`#${n.o+1} · ${n.y}`:`${n.y}`;
  });
  /* 연결선 */
  svg.setAttribute('width',W);svg.setAttribute('height',curH);
  let path='';
  orderList.forEach((n,i)=>{if(i){const p=orderList[i-1];
    path+=`<path d="M${p.px},${p.py} C${p.px},${(p.py+n.py)/2} ${n.px},${(p.py+n.py)/2} ${n.px},${n.py}"
      fill="none" stroke="${PH_COLOR[n.ph]}44" stroke-width="2.5"/>`;}});
  // 족보 수렴: 각 기둥 마지막 → 둠스데이, 둠스데이 → 시크릿 워즈
  const lastByCol={};
  orderList.forEach(n=>{lastByCol[Math.round(n.px/250)]=n;});
  for(const k in lastByCol){const last=lastByCol[k];
    path+=`<path d="M${last.px},${last.py+34} C${last.px},${doomN.py-90} ${doomN.px},${doomN.py-160} ${doomN.px},${doomN.py-40}"
      fill="none" stroke="#e6242938" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>`;}
  path+=`<path d="M${doomN.px},${doomN.py+40} L${swN.px},${swN.py-30}"
    fill="none" stroke="#8a63ff55" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>`;
  svg.innerHTML=path;
}
layout();

/* 정렬 토글 */
document.getElementById('sortctl').innerHTML=
  `<button class="sg on" data-m="rel">${L.sortRel}</button><button class="sg" data-m="story">${L.sortStory}</button>`;
document.querySelectorAll('.sg').forEach(b=>b.onclick=()=>{
  if(b.dataset.m===MODE)return;
  MODE=b.dataset.m;
  document.querySelectorAll('.sg').forEach(x=>x.classList.toggle('on',x.dataset.m===MODE));
  layout();fit();
});

/* ── 팬/줌 ── */
let sc=1,tx=0,ty=0;
function apply(){map.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;}
function fit(){
  const vw=innerWidth,vh=innerHeight;
  sc=Math.min((vw-40)/W,(vh-210)/curH);
  sc=Math.max(sc,0.12);
  tx=(vw-W*sc)/2;ty=128;apply();
}
function zoomAt(cx,cy,f){
  const ns=Math.min(2.2,Math.max(0.1,sc*f));
  tx=cx-(cx-tx)*ns/sc;ty=cy-(cy-ty)*ns/sc;sc=ns;apply();
}
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.13:0.885);},{passive:false});
let drag=null,pinch=null;
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);
  if(drag&&drag.id!==e.pointerId){pinch={a:drag,b:{id:e.pointerId,x:e.clientX,y:e.clientY},d0:0,s0:sc};drag=null;}
  else drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:0};
  stage.classList.add('drag');});
stage.addEventListener('pointermove',e=>{
  if(pinch){const p=pinch;const t=(p.a.id===e.pointerId)?p.a:(p.b.id===e.pointerId?p.b:null);
    if(!t)return;t.x=e.clientX;t.y=e.clientY;
    const d=Math.hypot(p.a.x-p.b.x,p.a.y-p.b.y);
    if(!p.d0){p.d0=d;return;}
    zoomAt((p.a.x+p.b.x)/2,(p.a.y+p.b.y)/2,(d/p.d0)*(p.s0/sc));
    return;}
  if(drag&&drag.id===e.pointerId){tx+=e.clientX-drag.x;ty+=e.clientY-drag.y;
    drag.moved+=Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y);
    drag.x=e.clientX;drag.y=e.clientY;apply();}});
function endP(e){if(pinch&&(pinch.a.id===e.pointerId||pinch.b.id===e.pointerId))pinch=null;
  if(drag&&drag.id===e.pointerId){
    if(drag.moved<8){ // 탭 판정 — setPointerCapture가 click을 가로채므로 여기서 처리
      const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.node');
      if(el&&el._node)openSheet(el._node,el);
      else{sheet.classList.remove('open');if(selEl)selEl.classList.remove('sel');}
    }
    drag=null;
  }
  stage.classList.remove('drag');}
stage.addEventListener('pointerup',endP);stage.addEventListener('pointercancel',endP);
document.getElementById('z-in').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.35);
document.getElementById('z-out').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,0.74);
document.getElementById('z-fit').onclick=fit;
addEventListener('resize',fit);

/* ── D-day ── */
function dday(){
  const target=new Date('2026-12-18T00:00:00+09:00'), now=new Date();
  const ms=target-now;
  const d=Math.max(0,Math.floor(ms/86400000));
  return {d, h:Math.max(0,Math.floor(ms/3600000)%24), m:Math.max(0,Math.floor(ms/60000)%60)};
}
function ddayTo(dateStr){
  const t=new Date(dateStr+'T00:00:00+09:00'),ms=t-new Date();
  return {past:ms<0,d:Math.max(0,Math.floor(ms/86400000)),h:Math.max(0,Math.floor(ms/3600000)%24),m:Math.max(0,Math.floor(ms/60000)%60)};
}
document.getElementById('node-dday').textContent='D-'+dday().d;
{const b=document.getElementById('node-dday-bnd');if(b){const bd=ddayTo('2026-07-31');b.textContent=bd.past?L.nowTag:(bd.d===0?'D-DAY':'D-'+bd.d)+' · '+L.soonTag;}}

/* ── 상세 시트 ── */
const sheet=document.getElementById('sheet'),body=document.getElementById('sheet-body');
let selEl=null;
function ykBlock(n){
  if(!n.ytKo||LANG!=='ko')return'';
  return`<div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${n.ytKo}" title="${n.en} 요약 리뷰"
    allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
    <a class="open-yt" href="https://www.youtube.com/watch?v=${n.ytKo}" target="_blank" rel="noreferrer">▶ 요약 리뷰 영상 보기</a>`;
}
function openSheet(n,el){
  if(selEl)selEl.classList.remove('sel');selEl=el;el.classList.add('sel');
  const pc=PH_COLOR[n.ph];
  if(n.soon){
    const bd=ddayTo(n.date);
    body.innerHTML=`<div class="doom-final" style="--pc:${pc}">
      <span class="ph-tag" style="--pc:${pc}">${L.phase(n.ph)} · ${bd.past?L.nowTag:L.soonTag}</span>
      <h2>${titleOf(n)}</h2><div class="en2">${LANG==='en'?'':n.en+' · '}${n.relL[LANG]}</div>
      ${bd.past?'':`<div class="dd-count">
        <div class="dd-cell"><b>${bd.d}</b><span>DAYS</span></div>
        <div class="dd-cell"><b>${bd.h}</b><span>HOURS</span></div>
        <div class="dd-cell"><b>${bd.m}</b><span>MIN</span></div>
      </div>`}
      <p class="sum">${sumOf(n)}</p>
      <div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${n.yt}" title="${n.en} Official Trailer"
        allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      <a class="open-yt" href="https://www.youtube.com/watch?v=${n.yt}" target="_blank" rel="noreferrer">${L.ytBtn}</a>
    </div>`;
    sheet.classList.add('open');return;
  }
  if(n.sw){
    body.innerHTML=`<span class="ph-tag" style="--pc:#8a63ff">${L.swTag} · 2027</span>
      <h2>${titleOf(n)}</h2><div class="en2">${LANG==='en'?'':n.en}</div>
      <p class="sum">${sumOf(n)}</p>${ykBlock(n)}`;
    sheet.classList.add('open');return;
  }
  if(n.doom){
    const dd=dday();
    body.innerHTML=`<div class="doom-final" style="--pc:${pc}">
      <span class="ph-tag" style="--pc:${pc}">${L.apex}</span>
      <h2>${titleOf(n)}</h2><div class="en2">${LANG==='en'?'':'Avengers: Doomsday · '}${L.release}</div>
      <div class="dd-count">
        <div class="dd-cell"><b>${dd.d}</b><span>DAYS</span></div>
        <div class="dd-cell"><b>${dd.h}</b><span>HOURS</span></div>
        <div class="dd-cell"><b>${dd.m}</b><span>MIN</span></div>
      </div>
      <p class="sum">${sumOf(DOOM)}</p>
      <div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${DOOM.yt}" title="Avengers: Doomsday Official Trailer"
        allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      <a class="open-yt" href="https://www.youtube.com/watch?v=${DOOM.yt}" target="_blank" rel="noreferrer">${L.ytBtn}</a>
    </div>`;
  }else{
    body.innerHTML=`<span class="ph-tag" style="--pc:${pc}">${L.phase(n.ph)}${n.sr?' · '+L.series:''} · ${n.y}</span>
      <h2>${titleOf(n)}</h2><div class="en2">${subOf(n)}</div>
      <p class="sum">${sumOf(n)}</p>${noteOf(n)?`<p class="note">${noteOf(n)}</p>`:''}${ykBlock(n)}`;
  }
  sheet.classList.add('open');
}
document.getElementById('sheet-close').onclick=()=>{sheet.classList.remove('open');if(selEl)selEl.classList.remove('sel');};

fit();
setTimeout(()=>{document.getElementById('hint').style.opacity=0;},6000);
</script>
</body>
</html>
