:root{

#stage{position:fixed;inset:0;cursor:grab;touch-action:none}
#stage.drag{cursor:grabbing}
#map{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}

.node{position:absolute;transform:translate(-50%,-50%);width:158px;background:#0d0f18f2;

.node .yr{font-size:10px;font-weight:700;color:var(--pc,#888);letter-spacing:.12em}
.node .tt{font-size:12.5px;font-weight:700;line-height:1.3;margin-top:2px}
.node .en{font-size:9.5px;color:var(--mut);margin-top:2px;line-height:1.25}
.node.series{width:138px;background:#0a0c13d9;border-style:dashed;border-left-style:solid}
.node.series .tt{font-size:11.5px}
.node.series .yr::after{content:' · D+ 시리즈';color:var(--mut);letter-spacing:0}
.node.doom{width:210px;background:linear-gradient(160deg,#170b0d,#0d0f18 60%);border:1px solid var(--red);

.node.doom .tt{font-size:15px;color:#ffd9da}

.lane-h small{display:block;font-family:var(--sans);font-weight:500;font-size:10px;color:var(--mut);letter-spacing:.04em;margin-top:2px}
.saga-tag{position:absolute;transform:translate(-50%,-50%);font-family:var(--disp);

#ctrl{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;display:flex;flex-direction:column;gap:8px}

#sheet .sum{font-size:14px;line-height:1.75;margin-top:12px;color:#c9cdda}
#sheet .note{font-size:12px;color:var(--gold);margin-top:10px;line-height:1.6}
#sheet .note::before{content:'※ '}
#sheet-close{position:absolute;top:12px;right:14px;border:none;background:#1a1e2e;color:var(--mut);
  width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer}

.doom-final .dd-cell span{font-size:10px;color:var(--mut);letter-spacing:.1em}

.doom-final .yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.doom-final .open-yt{display:block;text-align:center;margin-top:10px;font-size:12.5px;color:var(--ink);

footer{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;font-size:10px;color:#4a4f61}

@media(max-width:640px){#hint{bottom:auto;top:calc(96px + env(safe-area-inset-top))}}

{t:'닥터 스트레인지: 대혼돈의 멀티버스',en:'Doctor Strange in the Multiverse of Madness',y:2022,ph:4,s:'차원을 넘나드는 아메리카 차베즈를 두고 스트레인지와 스칼렛 위치가 충돌한다. 인커전 개념 등장.'},
{t:'토르: 러브 앤 썬더',en:'Thor: Love and Thunder',y:2022,ph:4,s:'신 도살자 고르에 맞서는 토르와 마이티 토르 제인. 토르가 딸 러브의 보호자가 된다.'},
{t:'블랙 팬서: 와칸다 포에버',en:'Black Panther: Wakanda Forever',y:2022,ph:4,s:'채드윅 보즈먼을 기리며, 슈리가 네이머의 탈로칸과의 전쟁 속에서 새 블랙 팬서가 된다.'},
{t:'앤트맨과 와스프: 퀀텀매니아',en:'Ant-Man and the Wasp: Quantumania',y:2023,ph:5,s:'양자영역에 갇힌 스캇 가족이 정복자 캉과 마주한다. 멀티버스 위협의 실체가 드러나기 시작.'},
{t:'가디언즈 오브 갤럭시 Vol.3',en:'Guardians of the Galaxy Vol. 3',y:2023,ph:5,s:'로켓의 과거와 하이 에볼루셔너리. 가디언즈 1기의 작별 인사이자 시리즈 최고의 피날레.'},
{t:'더 마블스',en:'The Marvels',y:2023,ph:5,s:'캐럴·모니카·카말라의 파워가 뒤엉킨다. 쿠키영상에서 엑스맨 세계관의 문이 열린다.'},
{t:'데드풀과 울버린',en:'Deadpool & Wolverine',y:2024,ph:5,s:'TVA에 끌려간 데드풀이 울버린과 시간선을 구한다. 폭스 유니버스를 MCU에 정식으로 접붙인 작품.'},
{t:'캡틴 아메리카: 브레이브 뉴 월드',en:'Captain America: Brave New World',y:2025,ph:5,s:'샘 윌슨의 첫 단독 영화. 대통령이 된 로스 장군이 레드 헐크로 변모하는 사건의 전말.'},
{t:'썬더볼츠*',en:'Thunderbolts*',y:2025,ph:5,s:'옐레나·버키 등 반영웅들이 세리와 만나 "뉴 어벤져스"를 자처하게 된다. 둠스데이 직전의 팀 셋업.'},
{t:'판타스틱 4: 새로운 출발',en:'The Fantastic Four: First Steps',y:2025,ph:6,s:'레트로퓨처 세계(어스-828)의 마블 퍼스트 패밀리가 갤럭투스에 맞선다. 둠스데이로 직행하는 다리.',n:'작중 배경은 1960년대풍 별도 유니버스'},
{t:'스파이더맨: 브랜드 뉴 데이',en:'Spider-Man: Brand New Day',y:2026,ph:6,s:'모두에게 잊힌 피터 파커의 새 출발. 둠스데이 직전 지상의 스파이더맨을 재정비하는 이야기.'},
];
const DOOM={t:'어벤져스: 둠스데이',en:'Avengers: Doomsday',y:2026,ph:6,
  date:'2026-12-18',
  s:'로버트 다우니 주니어가 닥터 둠으로 돌아온다. 루소 형제 연출로 어벤져스·판타스틱4·엑스맨까지 멀티버스의 히어로가 총집결하는 사가의 정점. 티저는 자비에 영재학교와 스티브 로저스의 귀환을 예고했다.',
  yt:'irVNGjRFZGk'};

/* ── 좌표 배치: 페이즈별 세로 기둥(가문) 6개, 연대기 선이 기둥을 타고 흐른다 ── */
const LANE_X={1:170,2:420,3:670,4:920,5:1170,6:1420};
const TOP=190, GAP=112;
const nodes=[...FILMS.map((f,i)=>({...f,i})),{...DOOM,i:FILMS.length,doom:1}];
const cnt={};
nodes.forEach(n=>{
  const k=cnt[n.ph]=(cnt[n.ph]||0)+1;
  n.px=LANE_X[n.ph]+(k%2?-30:30);
  n.py=TOP+(k-1)*GAP;
});
const doomN=nodes[nodes.length-1];
const maxY=Math.max(...nodes.slice(0,-1).map(n=>n.py));
doomN.px=810;doomN.py=maxY+220;
const W=1620,H=doomN.py+250;

const map=document.getElementById('map'),stage=document.getElementById('stage');
map.style.width=W+'px';map.style.height=H+'px';

/* 레인 헤더 + 사가 태그 */
let hh='';
for(const ph of [1,2,3,4,5,6]){
  const first=nodes.find(n=>n.ph===ph);
  const years={1:'2008–2012',2:'2013–2015',3:'2016–2019',4:'2021–2022',5:'2023–2025',6:'2025–2026'}[ph];
  hh+=`<div class="lane-h" style="--pc:${PH_COLOR[ph]};left:${LANE_X[ph]}px;top:${first.py-72}px">${PH_LABEL[ph]}<small>${years}</small></div>`;
}
hh+=`<div class="saga-tag" style="left:420px;top:${TOP-138}px;color:#e62429">INFINITY SAGA</div>`;
hh+=`<div class="saga-tag" style="left:1170px;top:${TOP-138}px;color:#8a63ff">MULTIVERSE SAGA</div>`;
map.insertAdjacentHTML('beforeend',hh);

/* 연결선 */
const svg=document.getElementById('edges');
svg.setAttribute('width',W);svg.setAttribute('height',H);
let path='';
nodes.forEach((n,i)=>{if(i&&!n.doom){const p=nodes[i-1];
  path+=`<path d="M${p.px},${p.py} C${p.px},${(p.py+n.py)/2} ${n.px},${(p.py+n.py)/2} ${n.px},${n.py}"
    fill="none" stroke="${PH_COLOR[n.ph]}44" stroke-width="2.5"/>`;}});
// 족보 수렴: 각 페이즈 기둥의 마지막 작품 → 둠스데이
for(const ph of [1,2,3,4,5,6]){
  const last=[...nodes].filter(n=>n.ph===ph&&!n.doom).pop();
  path+=`<path d="M${last.px},${last.py+34} C${last.px},${doomN.py-90} ${doomN.px},${doomN.py-160} ${doomN.px},${doomN.py-40}"
    fill="none" stroke="#e6242938" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>`;
}
svg.innerHTML=path;

/* 노드 */
nodes.forEach(n=>{
  const el=document.createElement('div');
  el.className='node'+(n.sr?' series':'')+(n.doom?' doom':'');
  el.style.setProperty('--pc',PH_COLOR[n.ph]);
  el.style.left=n.px+'px';el.style.top=n.py+'px';
  el.innerHTML=`<div class="yr">${n.y}</div><div class="tt">${n.t}</div><div class="en">${n.en}</div>`+
    (n.doom?`<div class="dday" id="node-dday"></div>`:'');
  el._node=n;
  map.appendChild(el);
});

/* ── 팬/줌 ── */
let sc=1,tx=0,ty=0;
function apply(){map.style.transform=`translate(${tx}px,${ty}px) scale(${sc})`;}
function fit(){
  const vw=innerWidth,vh=innerHeight;
  sc=Math.min((vw-40)/W,(vh-210)/H);
  sc=Math.max(sc,0.12);
  tx=(vw-W*sc)/2;ty=128;apply();
}
function zoomAt(cx,cy,f){
  const ns=Math.min(2.2,Math.max(0.1,sc*f));
  tx=cx-(cx-tx)*ns/sc;ty=cy-(cy-ty)*ns/sc;sc=ns;apply();
}
stage.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,e.deltaY<0?1.13:0.885);},{passive:false});
let drag=null,pinch=null;
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);
  if(drag&&drag.id!==e.pointerId){pinch={a:drag,b:{id:e.pointerId,x:e.clientX,y:e.clientY},d0:0,s0:sc};drag=null;}
  else drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:0};
  stage.classList.add('drag');});
stage.addEventListener('pointermove',e=>{
  if(pinch){const p=pinch;const t=(p.a.id===e.pointerId)?p.a:(p.b.id===e.pointerId?p.b:null);
    if(!t)return;t.x=e.clientX;t.y=e.clientY;
    const d=Math.hypot(p.a.x-p.b.x,p.a.y-p.b.y);
    if(!p.d0){p.d0=d;return;}
    zoomAt((p.a.x+p.b.x)/2,(p.a.y+p.b.y)/2,(d/p.d0)*(p.s0/sc));
    return;}
  if(drag&&drag.id===e.pointerId){tx+=e.clientX-drag.x;ty+=e.clientY-drag.y;
    drag.moved+=Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y);
    drag.x=e.clientX;drag.y=e.clientY;apply();}});
function endP(e){if(pinch&&(pinch.a.id===e.pointerId||pinch.b.id===e.pointerId))pinch=null;
  if(drag&&drag.id===e.pointerId){
    if(drag.moved<8){ // 탭 판정 — setPointerCapture가 click을 가로채므로 여기서 처리
      const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('.node');
      if(el&&el._node)openSheet(el._node,el);
      else{sheet.classList.remove('open');if(selEl)selEl.classList.remove('sel');}
    }
    drag=null;
  }
  stage.classList.remove('drag');}
stage.addEventListener('pointerup',endP);stage.addEventListener('pointercancel',endP);
document.getElementById('z-in').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,1.35);
document.getElementById('z-out').onclick=()=>zoomAt(innerWidth/2,innerHeight/2,0.74);
document.getElementById('z-fit').onclick=fit;
addEventListener('resize',fit);

/* ── D-day ── */
function dday(){
  const target=new Date('2026-12-18T00:00:00+09:00'), now=new Date();
  const ms=target-now;
  const d=Math.max(0,Math.floor(ms/86400000));
  return {d, h:Math.max(0,Math.floor(ms/3600000)%24), m:Math.max(0,Math.floor(ms/60000)%60)};
}
document.getElementById('node-dday').textContent='D-'+dday().d;

/* ── 상세 시트 ── */
const sheet=document.getElementById('sheet'),body=document.getElementById('sheet-body');
let selEl=null;
function openSheet(n,el){
  if(selEl)selEl.classList.remove('sel');selEl=el;el.classList.add('sel');
  const pc=PH_COLOR[n.ph];
  if(n.doom){
    const dd=dday();
    body.innerHTML=`<div class="doom-final" style="--pc:${pc}">
      <span class="ph-tag" style="--pc:${pc}">페이즈 6 · 사가의 정점</span>
      <h2>어벤져스: 둠스데이</h2><div class="en2">Avengers: Doomsday · 2026년 12월 18일 개봉</div>
      <div class="dd-count">
        <div class="dd-cell"><b>${dd.d}</b><span>DAYS</span></div>
        <div class="dd-cell"><b>${dd.h}</b><span>HOURS</span></div>
        <div class="dd-cell"><b>${dd.m}</b><span>MIN</span></div>
      </div>
      <p class="sum">${DOOM.s}</p>
      <div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/${DOOM.yt}" title="Avengers: Doomsday Official Trailer"
        allow="accelerometer; encrypted-media; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
      <a class="open-yt" href="https://www.youtube.com/watch?v=${DOOM.yt}" target="_blank" rel="noreferrer">▶ 공식 예고편 유튜브에서 보기</a>
    </div>`;
  }else{
    body.innerHTML=`<span class="ph-tag" style="--pc:${pc}">${PH_LABEL[n.ph]}${n.sr?' · 디즈니+ 시리즈':''} · ${n.y}</span>
      <h2>${n.t}</h2><div class="en2">${n.en}</div>
      <p class="sum">${n.s}</p>${n.n?`<p class="note">${n.n}</p>`:''}`;
  }
  sheet.classList.add('open');
}
document.getElementById('sheet-close').onclick=()=>{sheet.classList.remove('open');if(selEl)selEl.classList.remove('sel');};

fit();
setTimeout(()=>{document.getElementById('hint').style.opacity=0;},6000);
</script>
</body>
</html>
