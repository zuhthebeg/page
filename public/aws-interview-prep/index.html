<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>AWS ProServe 면접 준비 — 36일 아키텍트 커리큘럼 · page.cocy.io</title>
<meta name="description" content="AWS ProServe Senior AI Application Architect 면접 준비. AI Agent/MCP/Bedrock/Legacy Modernization까지 36개 개념을 하루 6회, 2시간 간격으로 정리." />
<link rel="canonical" href="https://page.cocy.io/aws-interview-prep/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#f7f5f0; --paper:#fffefb; --ink:#23201b; --ink-soft:#5c574e; --muted:#928b7e;
  --accent:#3a6ea5; --accent-2:#5b8fc7; --good:#3f7d4f; --warn:#b8860b; --bad:#a8443a;
  --line:rgba(35,32,27,.13); --line-soft:rgba(35,32,27,.07);
  --display:"Fraunces",serif; --body:"Noto Sans KR",sans-serif; --mono:"JetBrains Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;line-height:1.8;-webkit-font-smoothing:antialiased}
.doc{max-width:820px;margin:0 auto;padding:clamp(20px,5vw,48px) clamp(16px,4vw,24px) 100px}
.kicker{font-family:var(--mono);text-transform:uppercase;letter-spacing:.28em;font-size:.66rem;color:var(--accent)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.15;margin:.5rem 0 .6rem}
.lead{color:var(--ink-soft);font-size:1rem;max-width:60ch}
.progwrap{margin-top:1.4rem;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1rem 1.2rem}
.progtop{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.78rem;color:var(--muted);margin-bottom:.5rem}
.progbar{height:8px;border-radius:6px;background:var(--line-soft);overflow:hidden}
.progfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:6px;transition:width .3s}
.days{margin-top:2.4rem}
.day{margin-bottom:2rem}
.day h2{font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--ink-soft);margin-bottom:.8rem;padding-bottom:.4rem;border-bottom:1px solid var(--line)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:1.3rem 1.4rem;margin-bottom:1rem;scroll-margin-top:20px}
.card .top{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:.5rem}
.card .idx{font-family:var(--mono);font-size:.7rem;color:var(--accent)}
.card h3{font-family:var(--display);font-weight:600;font-size:1.25rem;flex:1;min-width:0}
.depth{font-size:.68rem;font-family:var(--mono);padding:.2rem .6rem;border-radius:20px;text-transform:uppercase;letter-spacing:.06em}
.depth.quick{background:rgba(63,125,79,.14);color:var(--good)}
.depth.medium{background:rgba(184,134,11,.14);color:var(--warn)}
.depth.deep{background:rgba(168,68,58,.12);color:var(--bad)}
.sec{margin-top:.8rem}
.sec .lbl{font-family:var(--mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);margin-bottom:.25rem}
.sec p{font-size:.92rem;color:var(--ink-soft);white-space:pre-wrap}
.interview{background:var(--bg);border-left:3px solid var(--accent-2);padding:.6rem .8rem;border-radius:4px;font-style:italic}
.refs{margin-top:.6rem;font-size:.82rem}
.refs a{color:var(--accent);word-break:break-all}
.empty{text-align:center;padding:4rem 1rem;color:var(--muted);font-family:var(--display);font-size:1.2rem}
.foot{margin-top:3rem;padding-top:1.2rem;border-top:1px solid var(--line);font-size:.76rem;color:var(--muted);font-family:var(--mono);text-align:center}
</style>
</head>
<body>
<div class="doc">
  <div class="kicker">Interview Prep · AWS ProServe</div>
  <h1>AWS ProServe Senior AI Application Architect 면접 준비</h1>
  <p class="lead">2026-09-23(수) recruiter 미팅 대비. AI Agent·MCP·Bedrock·Legacy Modernization까지 36개 개념을 하루 6회(10/12/14/16/18/20시), 2시간 간격으로 정리한 아카이브.</p>
  <div class="progwrap">
    <div class="progtop"><span id="p-label">불러오는 중…</span><span id="p-count">0/36</span></div>
    <div class="progbar"><div class="progfill" id="p-fill" style="width:0%"></div></div>
  </div>
  <div class="days" id="days"><div class="empty" id="loading">불러오는 중…</div></div>
  <div class="foot">page.cocy.io · non-indexed personal study log</div>
</div>
<script>
const $=id=>document.getElementById(id);
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function linkify(s){
  return esc(s).replace(/(https?:\/\/[^\s<]+)/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}
(async()=>{
  let entries=[];
  try{ const r=await fetch('entries.json',{cache:'no-store'}); entries=await r.json(); }catch{}
  $('p-count').textContent = entries.length+'/36';
  $('p-fill').style.width = Math.round(entries.length/36*100)+'%';
  $('p-label').textContent = entries.length>=36 ? '커리큘럼 완료' : `진행 중 (${entries.length}/36)`;
  if(!entries.length){ $('days').innerHTML='<div class="empty">아직 시작 전 — 첫 회차 대기 중</div>'; return; }
  const byDay={};
  entries.forEach(e=>{ (byDay[e.day]=byDay[e.day]||[]).push(e); });
  const days=Object.keys(byDay).sort((a,b)=>a-b);
  $('days').innerHTML = days.map(d=>{
    const items=byDay[d].sort((a,b)=>a.index-b.index).map(e=>{
      const s=e.sections||{};
      const refs=(e.refs||[]).length ? `<div class="refs">📎 ${e.refs.map(r=>`<a href="${esc(r)}" target="_blank" rel="noopener">${esc(r)}</a>`).join('<br>')}</div>` : '';
      return `<div class="card" id="t${e.index}">
        <div class="top"><span class="idx">#${e.index} · ${esc(e.date||'')}</span><h3>${esc(e.topic||'')}</h3><span class="depth ${esc(e.depth||'medium')}">${esc(e.depth||'')}</span></div>
        <div class="sec"><div class="lbl">한 줄 정의</div><p>${linkify(s.definition||'')}</p></div>
        <div class="sec"><div class="lbl">Architect 관점</div><p>${linkify(s.architect||'')}</p></div>
        <div class="sec"><div class="lbl">Trade-off</div><p>${linkify(s.tradeoff||'')}</p></div>
        <div class="sec"><div class="lbl">AWS 연결</div><p>${linkify(s.aws||'')}</p></div>
        <div class="sec"><div class="lbl">내 경험과 연결</div><p>${linkify(s.experience||'')}</p></div>
        <div class="sec"><div class="lbl">면접에서 말하기</div><p class="interview">${linkify(s.interview_en||'')}</p></div>
        <div class="sec"><div class="lbl">확인 질문</div><p>${linkify(s.question||'')}</p></div>
        ${refs}
      </div>`;
    }).join('');
    return `<div class="day"><h2>Day ${d} · ${esc(byDay[d][0].date||'')}</h2>${items}</div>`;
  }).join('');
  if(location.hash){ const el=document.querySelector(location.hash); if(el) setTimeout(()=>el.scrollIntoView({behavior:'smooth'}),200); }
})();
</script>
</body>
</html>
