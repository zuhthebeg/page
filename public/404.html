<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>없는 페이지 · page.cocy.io</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#0b0b0d;color:#ece9e4;font-family:"Noto Sans KR",sans-serif;font-weight:300;text-align:center;padding:24px}
h1{font-family:"Cormorant Garamond",serif;font-size:3rem;font-weight:500;margin:0 0 .4rem;color:#e9cd92}
p{color:#aaa6a0}
a{margin-top:2rem;color:#c9a86a;border:1px solid #c9a86a;padding:.8rem 1.6rem;border-radius:2px;text-decoration:none;
  font-size:.8rem;letter-spacing:.1em;text-transform:uppercase}
</style>
<script>
// FanTrack 하위 경로에서 404가 나면 FanTrack 메인으로 보낸다(언어 유지).
// voicematch 결과에서 아직 FanTrack에 없는 가수를 눌렀을 때를 위한 폴백.
(function(){
  var m = location.pathname.match(/^\/fantrack\/c\/[^/]+(?:\/([a-z]{2}))?\/?$/);
  if (!m) return;
  var lang = m[1] && ['en','tw','es'].indexOf(m[1]) >= 0 ? m[1] + '/' : '';
  location.replace('/fantrack/' + lang + location.search);
})();
</script>
</head>
<body>
<h1>여긴 아직 비어있어요</h1>
<p>이 주소의 페이지는 없거나 아직 발행되지 않았습니다.</p>
<a href="/">내 페이지 만들기 →</a>
</body>
</html>
